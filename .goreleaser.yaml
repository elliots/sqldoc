version: 2
project_name: sqldoc

builds:
  - id: sqldoc
    builder: bun
    binary: sqldoc
    main: packages/sqldoc/src/index.ts
    targets:
      - linux-x64-modern
      - linux-arm64
      - darwin-x64
      - darwin-arm64
      - windows-x64
    flags:
      - --compile
      - --minify

archives:
  - id: sqldoc
    builds: [sqldoc]
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "sqldoc_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'

brews:
  - name: sqldoc
    repository:
      owner: elliots
      name: homebrew-sqldoc
    homepage: https://github.com/elliots/sqldoc
    description: SQL documentation and code generation tool
    license: MIT
    install: |
      bin.install "sqldoc"
    test: |
      system "#{bin}/sqldoc", "--version"
