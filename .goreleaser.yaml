version: 2
project_name: sqldoc

# Binary builds are handled by scripts/build-binary.sh (fossilize).
# Run goreleaser with --skip=build after placing binaries in dist/.

builds:
  - id: sqldoc
    binary: sqldoc
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    # Dummy go build that will be skipped via --skip=build
    main: .
    hooks:
      post:
        - echo "skipped"

archives:
  - id: sqldoc
    builds: [sqldoc]
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "sqldoc_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'

brews:
  - name: sqldoc
    repository:
      owner: elliots
      name: homebrew-sqldoc
    homepage: https://github.com/elliots/sqldoc
    description: SQL documentation and code generation tool
    license: MIT
    install: |
      bin.install "sqldoc"
    test: |
      system "#{bin}/sqldoc", "--version"
