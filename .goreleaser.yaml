version: 2
project_name: sqldoc

# Binaries are built by CI (scripts/build-binary.sh) before GoReleaser runs.
# GoReleaser handles archiving, checksums, and Homebrew tap only.

builds:
  - id: sqldoc
    builder: go
    # Skip the actual Go build — we use pre-built Node.js SEA binaries
    skip: true
    binary: sqldoc
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

# CI places binaries at dist/sqldoc_<os>_<arch>/sqldoc before goreleaser runs.
# Use extra_files or a custom archive approach to pick them up.

archives:
  - id: sqldoc
    builds: [sqldoc]
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "sqldoc_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'

brews:
  - name: sqldoc
    repository:
      owner: elliots
      name: homebrew-sqldoc
    homepage: https://github.com/elliots/sqldoc
    description: SQL documentation and code generation tool
    license: MIT
    install: |
      bin.install "sqldoc"
    test: |
      system "#{bin}/sqldoc", "--version"
