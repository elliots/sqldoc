name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - name: bun
            version: latest
          - name: node
            version: "24"
          - name: node
            version: "25"

    name: test (${{ matrix.runtime.name }} ${{ matrix.runtime.version }})

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - if: matrix.runtime.name == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.runtime.version }}

      - run: bun install --frozen-lockfile

      # - name: Setup Rust
      #   uses: actions-rust-lang/setup-rust-toolchain@v1
      # - name: Cache wasm-pack
      #   uses: actions/cache@v4
      #   with:
      #     path: ~/.cargo/bin/wasm-pack
      #     key: wasm-pack-${{ runner.os }}
      # - name: Install wasm-pack
      #   run: command -v wasm-pack || cargo install wasm-pack
      # - name: Build sqlparser-ts
      #   run: cd sqlparser-ts && wasm-pack build --target web --out-dir wasm && npx tsdown

      - name: Run tests (bun)
        if: matrix.runtime.name == 'bun'
        run: bun run test:bun

      - name: Run tests (node)
        if: matrix.runtime.name == 'node'
        run: bun run test:node

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      # - name: Setup Rust
      #   uses: actions-rust-lang/setup-rust-toolchain@v1
      # - name: Cache wasm-pack
      #   uses: actions/cache@v4
      #   with:
      #     path: ~/.cargo/bin/wasm-pack
      #     key: wasm-pack-${{ runner.os }}
      # - name: Install wasm-pack
      #   run: command -v wasm-pack || cargo install wasm-pack
      # - name: Build sqlparser-ts
      #   run: cd sqlparser-ts && wasm-pack build --target web --out-dir wasm && npx tsdown
      - run: bun run check

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Check licenses
        run: bun run check:licenses
